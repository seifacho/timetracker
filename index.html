<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TimeTracker</title>
<style>
  :root{
    --bg:#07090a;
    --panel:#0d1310;
    --panel-2:#121a17;
    --border:#1c2822;
    --border-active:#1e5c3a;
    --green:#2bff8c;
    --green-dim:#0f7a44;
    --green-glow:rgba(43,255,140,0.35);
    --text:#e7f3ec;
    --muted:#7c9488;
    --muted-2:#4d5f57;
    --radius:14px;
    --mono:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand h1{
    font-size:20px;
    margin:0;
    letter-spacing:0.3px;
  }
  .brand h1 span{color:var(--green);}
  .brand .week-label{
    color:var(--muted);
    font-size:13px;
  }
  nav.tabs{
    display:flex;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:999px;
    padding:4px;
    gap:4px;
  }
  nav.tabs button{
    border:none;
    background:transparent;
    color:var(--muted);
    padding:8px 16px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    font-weight:600;
    transition:background .15s, color .15s;
  }
  nav.tabs button.active{
    background:var(--green-dim);
    color:#04140a;
    background:var(--green);
  }
  .icon-btn{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--muted);
    width:36px;
    height:36px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color .15s, color .15s;
  }
  .icon-btn:hover{border-color:var(--border-active); color:var(--green);}

  section{display:none;}
  section.active{display:block;}

  /* ---- Tracker view ---- */
  .week-summary{
    color:var(--muted);
    font-size:13px;
    margin-bottom:16px;
  }
  .week-summary b{color:var(--text);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:14px;
  }

  .cat-card{
    position:relative;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    min-height:140px;
    cursor:pointer;
    overflow:hidden;
    transition:border-color .2s, box-shadow .2s, background .2s;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .cat-card:hover{border-color:var(--border-active);}
  .cat-card.active{
    border-color:var(--cat-color, var(--green));
    background:linear-gradient(180deg, #0c1a13, #0a1512 60%, #0d1a14);
    box-shadow:0 0 0 1px var(--cat-glow, var(--green-glow)), 0 0 24px -4px var(--cat-glow, var(--green-glow));
    animation:pulseGlow 2.4s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 0 0 1px var(--cat-glow, var(--green-glow)), 0 0 18px -6px var(--cat-glow, var(--green-glow));}
    50%{box-shadow:0 0 0 1px var(--cat-glow, var(--green-glow)), 0 0 30px -2px var(--cat-glow, var(--green-glow));}
  }

  .cat-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    position:relative;
    z-index:2;
  }
  .cat-name{
    font-size:15px;
    font-weight:700;
    word-break:break-word;
    min-width:0;
  }
  .cat-card.active .cat-name{color:var(--cat-color, var(--green));}
  .cat-icon-row{
    display:flex;
    gap:2px;
    flex:0 0 auto;
  }
  .cat-icon-btn{
    background:transparent;
    border:none;
    color:var(--muted-2);
    cursor:pointer;
    font-size:12.5px;
    padding:3px 5px;
    border-radius:6px;
    line-height:1;
  }
  .cat-icon-btn:hover{color:var(--muted); background:var(--panel-2);}
  .cat-icon-btn.danger:hover{color:#ff8080; background:#ff6b6b15;}

  .cat-bottom{
    position:relative;
    z-index:2;
  }
  .cat-timer{
    font-family:var(--mono);
    font-size:22px;
    color:var(--cat-color, var(--green));
    letter-spacing:0.5px;
    margin-bottom:4px;
    min-height:26px;
    visibility:hidden;
  }
  .cat-card.active .cat-timer{visibility:visible;}
  .cat-week{
    color:var(--muted);
    font-size:12.5px;
  }
  .cat-card.active .cat-week{color:#a9d9c1;}
  .cat-status{
    color:var(--muted-2);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    margin-top:2px;
  }
  .cat-card.active .cat-status{color:var(--cat-color, var(--green));}

  .cat-rename-row, .cat-adjust-row, .cat-delete-row{
    display:flex;
    flex-direction:column;
    gap:8px;
    position:relative;
    z-index:3;
  }
  .cat-rename-row .fields{display:flex; gap:6px;}
  .cat-rename-row input[type=text]{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--border-active);
    color:var(--text);
    border-radius:6px;
    padding:5px 8px;
    font-size:14px;
    min-width:0;
  }
  .cat-rename-row input[type=color]{
    width:34px;
    height:30px;
    padding:2px;
    border:1px solid var(--border-active);
    border-radius:6px;
    background:var(--panel-2);
    cursor:pointer;
    flex:0 0 auto;
  }
  .cat-rename-row button, .cat-adjust-row button, .cat-delete-row button{
    background:var(--green-dim);
    border:none;
    color:#eafff2;
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
    font-size:12.5px;
  }
  .mode-toggle{display:flex; gap:4px;}
  .mode-btn{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:6px;
    padding:5px 0;
    font-size:11.5px;
    cursor:pointer;
  }
  .mode-btn.active{border-color:var(--green); color:var(--green); background:#0e1f16;}
  .cat-adjust-row input[type=date]{
    background:var(--panel-2);
    border:1px solid var(--border-active);
    color:var(--text);
    border-radius:6px;
    padding:5px 6px;
    font-size:12.5px;
    color-scheme:dark;
    width:100%;
  }
  .hm-row{display:flex; gap:6px; align-items:center;}
  .hm-row input[type=number]{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border-active);
    color:var(--text);
    border-radius:6px;
    padding:5px 6px;
    font-size:12.5px;
  }
  .hm-row span{color:var(--muted-2); font-size:11px;}
  .adjust-hint{color:var(--muted-2); font-size:10.5px; line-height:1.3;}
  .row2{display:flex; gap:6px;}
  .row2 button{flex:1;}
  .row2 .cancel{background:var(--panel-2); color:var(--muted);}
  .row2 .deduct{background:#5c1f1f; color:#ffd8d8;}
  .cat-delete-row .delete-msg{font-size:12px; color:var(--muted); line-height:1.4;}

  /* wave animation */
  .wave{
    position:absolute;
    left:0; right:0; bottom:0;
    height:44px;
    overflow:hidden;
    opacity:0;
    transition:opacity .3s;
    z-index:1;
    pointer-events:none;
  }
  .cat-card.active .wave{opacity:1;}
  .wave svg{display:block; width:200%; height:100%;}

  .add-card{
    background:transparent;
    border:1.5px dashed var(--border);
    border-radius:var(--radius);
    min-height:140px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    cursor:pointer;
    font-size:14px;
    transition:border-color .15s, color .15s;
  }
  .add-card:hover{border-color:var(--green-dim); color:var(--green);}
  .add-card.editing{
    flex-direction:column;
    gap:10px;
    padding:16px;
    cursor:default;
    border-style:solid;
  }
  .add-card input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--border-active);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-size:14px;
  }
  .add-card .row{display:flex; gap:8px; width:100%;}
  .add-card .row button{
    flex:1;
    border:none;
    border-radius:8px;
    padding:8px 0;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
  }
  .add-card .row .save{background:var(--green); color:#04140a;}
  .add-card .row .cancel{background:var(--panel-2); color:var(--muted);}

  .stop-bar{
    margin-top:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 16px;
  }
  .stop-bar .label{color:var(--muted); font-size:13px;}
  .stop-bar .label b{color:var(--green);}
  .stop-bar button{
    background:transparent;
    border:1px solid #ff6b6b55;
    color:#ff8080;
    padding:8px 16px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
  }
  .stop-bar button:hover{background:#ff6b6b15;}

  /* ---- Dashboard view ---- */
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .panel h2{
    font-size:13.5px;
    margin:0 0 14px;
    color:var(--text);
    font-weight:700;
  }
  .quick-ranges{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .quick-ranges button{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--muted);
    padding:7px 14px;
    border-radius:999px;
    font-size:12.5px;
    cursor:pointer;
  }
  .quick-ranges button.active{
    border-color:var(--green);
    color:var(--green);
    background:#0e1f16;
  }
  .range-row{
    display:flex;
    align-items:flex-end;
    gap:12px;
    flex-wrap:wrap;
  }
  .range-row label{
    display:flex;
    flex-direction:column;
    gap:4px;
    font-size:12px;
    color:var(--muted);
  }
  .range-row input[type=date]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 10px;
    border-radius:8px;
    font-size:13px;
    color-scheme:dark;
  }
  .range-row button.apply{
    background:var(--green);
    color:#04140a;
    border:none;
    padding:9px 18px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
    font-size:13px;
  }

  .stat-tile{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:6px;
  }
  .stat-tile .num{
    font-family:var(--mono);
    font-size:34px;
    color:var(--green);
    font-weight:700;
  }
  .stat-tile .sub{color:var(--muted); font-size:13px;}
  .range-caption{color:var(--muted-2); font-size:12px; margin-bottom:4px;}

  .bar-row{
    display:grid;
    grid-template-columns:120px 1fr 90px;
    align-items:center;
    gap:12px;
    padding:8px 0;
    border-bottom:1px solid var(--border);
  }
  .bar-row:last-child{border-bottom:none;}
  .bar-row .name{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-row .name.archived{color:var(--muted-2); font-weight:500; font-style:italic;}
  .bar-track{
    background:var(--panel-2);
    border-radius:6px;
    height:14px;
    overflow:hidden;
    position:relative;
  }
  .bar-fill{
    height:100%;
    border-radius:6px;
    transition:width .3s ease;
  }
  .bar-row .value{
    font-family:var(--mono);
    font-size:13px;
    color:var(--muted);
    text-align:right;
  }

  .table-toggle{
    background:transparent;
    border:none;
    color:var(--muted);
    font-size:12.5px;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
    margin-top:10px;
  }
  table.details{
    width:100%;
    border-collapse:collapse;
    margin-top:12px;
    font-size:13px;
    display:none;
  }
  table.details.show{display:table;}
  table.details th, table.details td{
    text-align:left;
    padding:8px 6px;
    border-bottom:1px solid var(--border);
    color:var(--muted);
  }
  table.details th{color:var(--muted-2); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:0.4px;}
  table.details td.cat{color:var(--text); font-weight:600;}
  table.details td.num{font-family:var(--mono); color:var(--green);}

  .empty-note{color:var(--muted-2); font-size:13px; padding:12px 0;}

  .chart-wrap{width:100%; overflow-x:auto;}
  .chart-wrap svg{display:block;}
  .chart-legend{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:12px;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);}
  .legend-swatch{width:10px; height:10px; border-radius:3px; flex:0 0 auto;}
  .pie-wrap{display:flex; justify-content:center;}

  /* ---- Settings drawer ---- */
  .settings-panel{
    display:none;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-bottom:20px;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .settings-panel.show{display:flex;}
  .settings-panel .desc{color:var(--muted); font-size:12.5px; flex:1 1 220px;}
  .settings-panel button{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:12.5px;
  }
  .settings-panel button:hover{border-color:var(--border-active);}

  @media (max-width:520px){
    .bar-row{grid-template-columns:90px 1fr 74px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>Time<span>Tracker</span></h1>
      <span class="week-label" id="weekLabel"></span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <nav class="tabs">
        <button id="tabTracker" class="active">Tracker</button>
        <button id="tabDashboard">Dashboard</button>
      </nav>
      <button class="icon-btn" id="settingsBtn" title="Settings">&#9881;</button>
    </div>
  </header>

  <div class="settings-panel" id="settingsPanel">
    <span class="desc">Data is stored only in this browser. Export a backup regularly, or import one to restore it.</span>
    <button id="exportBtn">Export JSON</button>
    <button id="importBtn">Import JSON</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" />
  </div>

  <!-- Tracker -->
  <section id="viewTracker" class="active">
    <div class="week-summary" id="weekSummary"></div>
    <div class="grid" id="catGrid"></div>

    <div class="stop-bar" id="stopBar" style="display:none;">
      <div class="label">Currently tracking <b id="activeCatName"></b> &mdash; <span id="activeElapsed"></span></div>
      <button id="stopBtn">Stop</button>
    </div>
  </section>

  <!-- Dashboard -->
  <section id="viewDashboard">
    <div class="panel">
      <div class="quick-ranges" id="quickRanges">
        <button data-range="week">This Week</button>
        <button data-range="lastweek">Last Week</button>
        <button data-range="month">This Month</button>
        <button data-range="all">All Time</button>
      </div>
      <div class="range-row">
        <label>From <input type="date" id="fromDate" /></label>
        <label>To <input type="date" id="toDate" /></label>
        <button class="apply" id="applyRange">Apply</button>
      </div>
    </div>

    <div class="panel">
      <div class="range-caption" id="rangeCaption"></div>
      <div class="stat-tile">
        <div class="num" id="totalHours">0h 00m</div>
        <div class="sub">total tracked</div>
      </div>
      <div id="barList"></div>
      <div class="empty-note" id="emptyNote" style="display:none;">No time tracked in this range yet.</div>
      <button class="table-toggle" id="tableToggle">Show details table</button>
      <table class="details" id="detailsTable">
        <thead><tr><th>Category</th><th>Hours</th><th>% of range</th></tr></thead>
        <tbody id="detailsBody"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Daily breakdown</h2>
      <div class="chart-wrap" id="dailyChartWrap"></div>
      <div class="chart-legend" id="dailyLegend"></div>
      <div class="empty-note" id="dailyEmptyNote" style="display:none;"></div>
    </div>

    <div class="panel">
      <h2>Share of time</h2>
      <div class="pie-wrap" id="pieWrap"></div>
      <div class="chart-legend" id="pieLegend"></div>
    </div>

    <div class="panel">
      <h2>Weekly total &mdash; last 8 weeks</h2>
      <div class="chart-wrap" id="trendChartWrap"></div>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";
  const STORAGE_KEY = "timetracker_v1";
  const DEFAULT_COLOR = "#2bff8c";

  function genId(prefix){
    return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function defaultState(){
    return {
      categories:[
        {id:genId("cat"), name:"Work 1", color:DEFAULT_COLOR, archived:false},
        {id:genId("cat"), name:"Work 2", color:DEFAULT_COLOR, archived:false},
        {id:genId("cat"), name:"Work 3", color:DEFAULT_COLOR, archived:false},
        {id:genId("cat"), name:"Other", color:DEFAULT_COLOR, archived:false}
      ],
      sessions:[],
      adjustments:[]
    };
  }

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.categories) && Array.isArray(parsed.sessions)){
          parsed.categories.forEach(c => {
            if(!c.color) c.color = DEFAULT_COLOR;
            if(c.archived == null) c.archived = false;
          });
          if(!Array.isArray(parsed.adjustments)) parsed.adjustments = [];
          return parsed;
        }
      }
    }catch(e){}
    return defaultState();
  }

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  let state = load();

  // ---------- time helpers ----------
  function getWeekStart(date){
    const d = new Date(date);
    d.setHours(0,0,0,0);
    const day = d.getDay(); // 0 Sun .. 6 Sat
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }
  function addDays(date, n){
    const d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  }
  function toDateInputValue(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function dateFromInputStartOfDay(str){
    return new Date(str + "T00:00:00");
  }
  function fmtHoursMinutes(ms){
    const totalMin = Math.floor(ms / 60000);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return `${h}h ${String(m).padStart(2,"0")}m`;
  }
  function fmtClock(ms){
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }
  function fmtDateLabel(d){
    return d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
  }
  function hexToRgba(hex, alpha){
    let h = (hex || DEFAULT_COLOR).replace("#","");
    if(h.length === 3) h = h.split("").map(c => c+c).join("");
    const num = parseInt(h, 16) || 0x2bff8c;
    const r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function clippedDuration(session, rangeStart, rangeEnd){
    const s = session.start;
    const e = session.end == null ? Date.now() : session.end;
    const start = Math.max(s, rangeStart);
    const end = Math.min(e, rangeEnd);
    return Math.max(0, end - start);
  }

  function totalsForRange(rangeStart, rangeEnd){
    const totals = {};
    for(const cat of state.categories) totals[cat.id] = 0;
    for(const s of state.sessions){
      if(!(s.categoryId in totals)) totals[s.categoryId] = 0;
      totals[s.categoryId] += clippedDuration(s, rangeStart, rangeEnd);
    }
    for(const adj of state.adjustments){
      if(adj.date >= rangeStart && adj.date < rangeEnd){
        if(!(adj.categoryId in totals)) totals[adj.categoryId] = 0;
        totals[adj.categoryId] += adj.amountMs;
      }
    }
    for(const id in totals) totals[id] = Math.max(0, totals[id]);
    return totals;
  }

  function getActiveSession(){
    return state.sessions.find(s => s.end == null) || null;
  }

  // ---------- actions ----------
  function startTracking(catId){
    const active = getActiveSession();
    if(active && active.categoryId === catId){
      stopTracking();
      return;
    }
    if(active){
      active.end = Date.now();
    }
    state.sessions.push({id:genId("s"), categoryId:catId, start:Date.now(), end:null});
    save();
    renderTracker();
  }

  function stopTracking(){
    const active = getActiveSession();
    if(active){
      active.end = Date.now();
      save();
      renderTracker();
    }
  }

  function addCategory(name){
    name = name.trim();
    if(!name) return;
    state.categories.push({id:genId("cat"), name, color:DEFAULT_COLOR, archived:false});
    save();
    renderTracker();
  }

  function renameCategory(id, newName, newColor){
    newName = newName.trim();
    if(!newName) return;
    const cat = state.categories.find(c => c.id === id);
    if(cat){
      cat.name = newName;
      if(newColor) cat.color = newColor;
      save();
      renderTracker();
      if(document.getElementById("viewDashboard").classList.contains("active")) renderDashboard();
    }
  }

  function deleteCategory(id){
    const cat = state.categories.find(c => c.id === id);
    if(!cat) return;
    const active = getActiveSession();
    if(active && active.categoryId === id) active.end = Date.now();
    cat.archived = true;
    save();
    renderTracker();
    if(document.getElementById("viewDashboard").classList.contains("active")) renderDashboard();
  }

  function addAdjustment(categoryId, dateMs, amountMs){
    if(!amountMs) return;
    state.adjustments.push({id:genId("adj"), categoryId, date:dateMs, amountMs, createdAt:Date.now()});
    save();
    renderTracker();
    if(document.getElementById("viewDashboard").classList.contains("active")) renderDashboard();
  }

  // ---------- wave svg ----------
  function waveSvg(color){
    const c1 = hexToRgba(color, 0.16);
    const c2 = hexToRgba(color, 0.30);
    return `
    <svg viewBox="0 0 200 44" preserveAspectRatio="none">
      <path d="M0,26 C15,10 35,10 50,26 C65,42 85,42 100,26 C115,10 135,10 150,26 C165,42 185,42 200,26 L200,44 L0,44 Z"
            fill="${c1}">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M0,30 C15,18 35,18 50,30 C65,42 85,42 100,30 C115,18 135,18 150,30 C165,42 185,42 200,30 L200,44 L0,44 Z"
            fill="${c2}">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="1.9s" repeatCount="indefinite"/>
      </path>
    </svg>`;
  }

  // ---------- rendering: tracker ----------
  let addingCategory = false;
  let editingCategoryId = null;
  let adjustingCategoryId = null;
  let deletingCategoryId = null;

  function closeAllCardPanels(){
    editingCategoryId = null;
    adjustingCategoryId = null;
    deletingCategoryId = null;
  }

  function renderTracker(){
    const grid = document.getElementById("catGrid");
    const weekStart = getWeekStart(new Date());
    const weekEnd = addDays(weekStart, 7);
    document.getElementById("weekLabel").textContent =
      `Week of ${fmtDateLabel(weekStart)} – ${fmtDateLabel(addDays(weekEnd,-1))}`;

    const totals = totalsForRange(weekStart.getTime(), weekEnd.getTime());
    const weekTotalMs = Object.values(totals).reduce((a,b)=>a+b,0);
    document.getElementById("weekSummary").innerHTML =
      `This week so far: <b>${fmtHoursMinutes(weekTotalMs)}</b>`;

    const active = getActiveSession();
    const visibleCategories = state.categories.filter(c => !c.archived);

    grid.innerHTML = "";
    for(const cat of visibleCategories){
      const card = document.createElement("div");
      card.className = "cat-card" + (active && active.categoryId === cat.id ? " active" : "");
      card.dataset.id = cat.id;
      card.style.setProperty("--cat-color", cat.color || DEFAULT_COLOR);
      card.style.setProperty("--cat-glow", hexToRgba(cat.color || DEFAULT_COLOR, 0.35));

      const wave = document.createElement("div");
      wave.className = "wave";
      wave.innerHTML = waveSvg(cat.color || DEFAULT_COLOR);
      card.appendChild(wave);

      if(editingCategoryId === cat.id){
        renderRenameForm(card, cat, grid);
        continue;
      }
      if(adjustingCategoryId === cat.id){
        renderAdjustForm(card, cat, grid);
        continue;
      }
      if(deletingCategoryId === cat.id){
        renderDeleteForm(card, cat, grid);
        continue;
      }

      const top = document.createElement("div");
      top.className = "cat-top";
      top.innerHTML = `<div class="cat-name">${escapeHtml(cat.name)}</div>
        <div class="cat-icon-row">
          <button class="cat-icon-btn" data-action="rename" title="Rename / color">&#9998;</button>
          <button class="cat-icon-btn" data-action="adjust" title="Add or deduct hours">&#177;</button>
          <button class="cat-icon-btn danger" data-action="delete" title="Delete">&#128465;</button>
        </div>`;
      card.appendChild(top);

      const bottom = document.createElement("div");
      bottom.className = "cat-bottom";
      const isActive = active && active.categoryId === cat.id;
      bottom.innerHTML = `
        <div class="cat-timer" data-role="timer">${isActive ? fmtClock(Date.now()-active.start) : "00:00:00"}</div>
        <div class="cat-week" data-role="week">This week: ${fmtHoursMinutes(totals[cat.id]||0)}</div>
        <div class="cat-status">${isActive ? "Tracking" : "Tap to start"}</div>
      `;
      card.appendChild(bottom);

      card.addEventListener("click", () => startTracking(cat.id));
      top.querySelector('[data-action="rename"]').addEventListener("click", (e) => {
        e.stopPropagation();
        closeAllCardPanels();
        editingCategoryId = cat.id;
        renderTracker();
      });
      top.querySelector('[data-action="adjust"]').addEventListener("click", (e) => {
        e.stopPropagation();
        closeAllCardPanels();
        adjustingCategoryId = cat.id;
        renderTracker();
      });
      top.querySelector('[data-action="delete"]').addEventListener("click", (e) => {
        e.stopPropagation();
        closeAllCardPanels();
        deletingCategoryId = cat.id;
        renderTracker();
      });

      grid.appendChild(card);
    }

    // add-card
    const addCard = document.createElement("div");
    if(addingCategory){
      addCard.className = "add-card editing";
      addCard.innerHTML = `
        <input type="text" id="newCatInput" placeholder="Segment name" maxlength="40" />
        <div class="row">
          <button class="save">Add</button>
          <button class="cancel">Cancel</button>
        </div>`;
      grid.appendChild(addCard);
      const input = addCard.querySelector("#newCatInput");
      const commit = () => {
        addingCategory = false;
        addCategory(input.value);
      };
      addCard.querySelector(".save").addEventListener("click", commit);
      addCard.querySelector(".cancel").addEventListener("click", () => {
        addingCategory = false;
        renderTracker();
      });
      input.addEventListener("keydown", e => {
        if(e.key === "Enter") commit();
        if(e.key === "Escape"){ addingCategory = false; renderTracker(); }
      });
      setTimeout(()=> input.focus(), 0);
    } else {
      addCard.className = "add-card";
      addCard.innerHTML = "+ Add segment";
      addCard.addEventListener("click", () => {
        addingCategory = true;
        renderTracker();
      });
      grid.appendChild(addCard);
    }

    // stop bar
    const stopBar = document.getElementById("stopBar");
    if(active){
      stopBar.style.display = "flex";
      const cat = state.categories.find(c => c.id === active.categoryId);
      document.getElementById("activeCatName").textContent = cat ? cat.name : "?";
      document.getElementById("activeElapsed").textContent = fmtClock(Date.now()-active.start);
    } else {
      stopBar.style.display = "none";
    }
  }

  function renderRenameForm(card, cat, grid){
    const row = document.createElement("div");
    row.className = "cat-rename-row";
    row.innerHTML = `
      <div class="fields">
        <input type="color" value="${cat.color || DEFAULT_COLOR}" />
        <input type="text" value="${escapeHtml(cat.name)}" maxlength="40" />
      </div>
      <div class="row2">
        <button class="save">Save</button>
        <button class="cancel">Cancel</button>
      </div>`;
    card.appendChild(row);
    const colorInput = row.querySelector('input[type=color]');
    const nameInput = row.querySelector('input[type=text]');
    const commit = () => {
      editingCategoryId = null;
      renameCategory(cat.id, nameInput.value, colorInput.value);
    };
    row.querySelector(".save").addEventListener("click", (e) => { e.stopPropagation(); commit(); });
    row.querySelector(".cancel").addEventListener("click", (e) => {
      e.stopPropagation();
      editingCategoryId = null;
      renderTracker();
    });
    row.addEventListener("click", e => e.stopPropagation());
    nameInput.addEventListener("keydown", e => {
      if(e.key === "Enter"){ commit(); }
      if(e.key === "Escape"){ editingCategoryId = null; renderTracker(); }
    });
    card.addEventListener("click", e => e.stopPropagation());
    grid.appendChild(card);
    setTimeout(()=>{ nameInput.focus(); nameInput.select(); }, 0);
  }

  function renderAdjustForm(card, cat, grid){
    const row = document.createElement("div");
    row.className = "cat-adjust-row";
    const today = toDateInputValue(new Date());
    row.innerHTML = `
      <div class="mode-toggle">
        <button type="button" class="mode-btn active" data-mode="day">Day</button>
        <button type="button" class="mode-btn" data-mode="week">Week</button>
      </div>
      <input type="date" class="adjust-date" value="${today}" />
      <div class="hm-row">
        <input type="number" class="adjust-h" min="0" max="999" placeholder="0" />
        <span>h</span>
        <input type="number" class="adjust-m" min="0" max="59" placeholder="0" />
        <span>m</span>
      </div>
      <div class="adjust-hint">Week mode applies the whole amount to that week's Monday.</div>
      <div class="row2">
        <button class="add">+ Add</button>
        <button class="deduct">&minus; Deduct</button>
      </div>
      <div class="row2">
        <button class="cancel">Cancel</button>
      </div>`;
    card.appendChild(row);
    row.addEventListener("click", e => e.stopPropagation());

    let mode = "day";
    const modeBtns = row.querySelectorAll(".mode-btn");
    modeBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        mode = btn.dataset.mode;
        modeBtns.forEach(b => b.classList.toggle("active", b === btn));
      });
    });

    const dateInput = row.querySelector(".adjust-date");
    const hInput = row.querySelector(".adjust-h");
    const mInput = row.querySelector(".adjust-m");

    const apply = (sign) => {
      const h = parseInt(hInput.value, 10) || 0;
      const m = parseInt(mInput.value, 10) || 0;
      const amountMs = (h * 60 + m) * 60000;
      if(amountMs <= 0 || !dateInput.value) return;
      let dateMs;
      if(mode === "week"){
        dateMs = getWeekStart(dateFromInputStartOfDay(dateInput.value)).getTime();
      } else {
        dateMs = dateFromInputStartOfDay(dateInput.value).getTime();
      }
      adjustingCategoryId = null;
      addAdjustment(cat.id, dateMs, sign * amountMs);
    };

    row.querySelector(".add").addEventListener("click", () => apply(1));
    row.querySelector(".deduct").addEventListener("click", () => apply(-1));
    row.querySelector(".cancel").addEventListener("click", () => {
      adjustingCategoryId = null;
      renderTracker();
    });
    card.addEventListener("click", e => e.stopPropagation());
    grid.appendChild(card);
  }

  function renderDeleteForm(card, cat, grid){
    const row = document.createElement("div");
    row.className = "cat-delete-row";
    row.innerHTML = `
      <div class="delete-msg">Delete "${escapeHtml(cat.name)}"? It disappears from the tracker, but its tracked hours stay in your Dashboard history.</div>
      <div class="row2">
        <button class="deduct confirm">Delete</button>
        <button class="cancel">Cancel</button>
      </div>`;
    card.appendChild(row);
    row.addEventListener("click", e => e.stopPropagation());
    row.querySelector(".confirm").addEventListener("click", () => {
      deletingCategoryId = null;
      deleteCategory(cat.id);
    });
    row.querySelector(".cancel").addEventListener("click", () => {
      deletingCategoryId = null;
      renderTracker();
    });
    card.addEventListener("click", e => e.stopPropagation());
    grid.appendChild(card);
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // lightweight per-second tick: update only live numbers, no full re-render
  function tick(){
    const active = getActiveSession();
    if(!active) return;
    document.querySelectorAll(".cat-card.active [data-role='timer']").forEach(el=>{
      el.textContent = fmtClock(Date.now() - active.start);
    });
    const elapsedEl = document.getElementById("activeElapsed");
    if(elapsedEl) elapsedEl.textContent = fmtClock(Date.now() - active.start);

    // refresh this-week total for the active category (grows every second)
    const weekStart = getWeekStart(new Date());
    const weekEnd = addDays(weekStart, 7);
    const totals = totalsForRange(weekStart.getTime(), weekEnd.getTime());
    const weekTotalMs = Object.values(totals).reduce((a,b)=>a+b,0);
    document.getElementById("weekSummary").innerHTML = `This week so far: <b>${fmtHoursMinutes(weekTotalMs)}</b>`;
    document.querySelectorAll(".cat-card").forEach(card=>{
      const id = card.dataset.id;
      const weekEl = card.querySelector("[data-role='week']");
      if(weekEl && id in totals) weekEl.textContent = `This week: ${fmtHoursMinutes(totals[id])}`;
    });
  }
  setInterval(tick, 1000);

  document.getElementById("stopBtn").addEventListener("click", stopTracking);

  // ---------- rendering: dashboard ----------
  let currentRange = null; // {start, end}

  function setQuickRangeActive(key){
    document.querySelectorAll("#quickRanges button").forEach(b=>{
      b.classList.toggle("active", b.dataset.range === key);
    });
  }

  function applyQuickRange(key){
    const now = new Date();
    let start, end;
    if(key === "week"){
      start = getWeekStart(now);
      end = addDays(start, 7);
    } else if(key === "lastweek"){
      const thisWeekStart = getWeekStart(now);
      start = addDays(thisWeekStart, -7);
      end = thisWeekStart;
    } else if(key === "month"){
      start = new Date(now.getFullYear(), now.getMonth(), 1);
      end = new Date(now.getFullYear(), now.getMonth()+1, 1);
    } else { // all
      const earliestTimes = [
        ...state.sessions.map(s=>s.start),
        ...state.adjustments.map(a=>a.date)
      ];
      if(earliestTimes.length === 0){
        start = getWeekStart(now);
      } else {
        start = new Date(Math.min(...earliestTimes));
        start.setHours(0,0,0,0);
      }
      end = addDays(new Date(now.getFullYear(), now.getMonth(), now.getDate()), 1);
    }
    document.getElementById("fromDate").value = toDateInputValue(start);
    document.getElementById("toDate").value = toDateInputValue(addDays(end,-1));
    setQuickRangeActive(key);
    currentRange = {start: start.getTime(), end: end.getTime()};
    renderDashboard();
  }

  function applyCustomRange(){
    const fromStr = document.getElementById("fromDate").value;
    const toStr = document.getElementById("toDate").value;
    if(!fromStr || !toStr) return;
    const start = dateFromInputStartOfDay(fromStr);
    const end = addDays(dateFromInputStartOfDay(toStr), 1);
    if(start.getTime() > end.getTime()) return;
    setQuickRangeActive(null);
    currentRange = {start: start.getTime(), end: end.getTime()};
    renderDashboard();
  }

  let showTable = false;

  function renderDashboard(){
    if(!currentRange) return;
    const {start, end} = currentRange;
    const totals = totalsForRange(start, end);
    const totalMs = Object.values(totals).reduce((a,b)=>a+b,0);

    document.getElementById("rangeCaption").textContent =
      `${fmtDateLabel(new Date(start))} – ${fmtDateLabel(addDays(new Date(end),-1))}`;
    document.getElementById("totalHours").textContent = fmtHoursMinutes(totalMs);

    const rows = state.categories
      .filter(cat => !cat.archived || (totals[cat.id]||0) > 0)
      .map(cat => ({cat, ms: totals[cat.id] || 0}))
      .sort((a,b) => b.ms - a.ms);

    const maxMs = Math.max(1, ...rows.map(r => r.ms));
    const barList = document.getElementById("barList");
    const emptyNote = document.getElementById("emptyNote");
    barList.innerHTML = "";

    emptyNote.style.display = totalMs === 0 ? "block" : "none";

    rows.forEach(r => {
      const ratio = r.ms / maxMs;
      const row = document.createElement("div");
      row.className = "bar-row";
      const nameLabel = escapeHtml(r.cat.name) + (r.cat.archived ? " (deleted)" : "");
      row.innerHTML = `
        <div class="name${r.cat.archived ? " archived" : ""}">${nameLabel}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(ratio*100).toFixed(1)}%; background:${r.cat.color || DEFAULT_COLOR};"></div></div>
        <div class="value">${fmtHoursMinutes(r.ms)}</div>
      `;
      barList.appendChild(row);
    });

    const body = document.getElementById("detailsBody");
    body.innerHTML = "";
    rows.forEach(r => {
      const pct = totalMs > 0 ? ((r.ms / totalMs) * 100).toFixed(1) : "0.0";
      const tr = document.createElement("tr");
      const nameLabel = escapeHtml(r.cat.name) + (r.cat.archived ? " (deleted)" : "");
      tr.innerHTML = `<td class="cat">${nameLabel}</td><td class="num">${fmtHoursMinutes(r.ms)}</td><td>${pct}%</td>`;
      body.appendChild(tr);
    });

    renderDailyChart(start, end);
    renderPieChart(totals, totalMs);
    renderTrendChart();
  }

  function renderDailyChart(start, end){
    const wrap = document.getElementById("dailyChartWrap");
    const legend = document.getElementById("dailyLegend");
    const note = document.getElementById("dailyEmptyNote");
    const dayMs = 86400000;
    const numDays = Math.round((end - start) / dayMs);

    if(numDays > 60){
      wrap.innerHTML = "";
      legend.innerHTML = "";
      note.style.display = "block";
      note.textContent = `Pick a range of 60 days or less to see the daily breakdown (currently ${numDays} days).`;
      return;
    }

    const cats = state.categories.filter(c => !c.archived);
    const days = [];
    for(let i=0;i<numDays;i++){
      const dayStart = start + i*dayMs;
      days.push({date:new Date(dayStart), totals:totalsForRange(dayStart, dayStart+dayMs)});
    }
    const dayTotalsSum = days.map(d => cats.reduce((s,c)=>s+(d.totals[c.id]||0),0));
    const maxMs = Math.max(1, ...dayTotalsSum);

    if(maxMs <= 1 && dayTotalsSum.every(v => v === 0)){
      wrap.innerHTML = "";
      legend.innerHTML = "";
      note.style.display = "block";
      note.textContent = "No time tracked in this range yet.";
      return;
    }
    note.style.display = "none";

    const width = Math.max(360, numDays*36);
    const chartH = 130;
    const height = 156;
    const slotW = width / numDays;
    const barW = Math.min(28, slotW - 6);

    let bars = "";
    days.forEach((d,i) => {
      let yOffset = 0;
      const x = i*slotW + (slotW-barW)/2;
      cats.forEach(cat => {
        const ms = d.totals[cat.id] || 0;
        if(ms <= 0) return;
        const h = (ms/maxMs)*chartH;
        const y = chartH - yOffset - h;
        bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" fill="${cat.color || DEFAULT_COLOR}" rx="2"><title>${escapeHtml(cat.name)}: ${fmtHoursMinutes(ms)} on ${fmtDateLabel(d.date)}</title></rect>`;
        yOffset += h;
      });
    });

    const labelEvery = numDays <= 14 ? 1 : Math.ceil(numDays/12);
    let labels = "";
    days.forEach((d,i) => {
      if(i % labelEvery !== 0) return;
      const x = i*slotW + slotW/2;
      labels += `<text x="${x.toFixed(1)}" y="${chartH+16}" font-size="10" text-anchor="middle" style="fill:var(--muted)">${fmtDateLabel(d.date)}</text>`;
    });

    wrap.innerHTML = `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" style="min-width:${width}px;">
        <line x1="0" y1="${chartH}" x2="${width}" y2="${chartH}" style="stroke:var(--border)" stroke-width="1"/>
        ${bars}
        ${labels}
      </svg>`;

    legend.innerHTML = cats.map(c => `<span class="legend-item"><span class="legend-swatch" style="background:${c.color || DEFAULT_COLOR}"></span>${escapeHtml(c.name)}</span>`).join("");
  }

  function renderPieChart(totals, totalMs){
    const wrap = document.getElementById("pieWrap");
    const legend = document.getElementById("pieLegend");
    const cats = state.categories.filter(cat => (totals[cat.id]||0) > 0);

    if(totalMs <= 0 || cats.length === 0){
      wrap.innerHTML = `<div class="empty-note">No time tracked in this range yet.</div>`;
      legend.innerHTML = "";
      return;
    }

    cats.sort((a,b) => (totals[b.id]||0) - (totals[a.id]||0));

    const size = 180, r = 68, cx = size/2, cy = size/2, circumference = 2*Math.PI*r;
    let offset = 0;
    let arcs = "";
    cats.forEach(cat => {
      const ms = totals[cat.id] || 0;
      const frac = ms / totalMs;
      const dash = frac * circumference;
      arcs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${cat.color || DEFAULT_COLOR}" stroke-width="22"
        stroke-dasharray="${dash.toFixed(2)} ${(circumference-dash).toFixed(2)}"
        stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})">
        <title>${escapeHtml(cat.name)}: ${fmtHoursMinutes(ms)} (${(frac*100).toFixed(1)}%)</title>
        </circle>`;
      offset += dash;
    });

    wrap.innerHTML = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
        ${arcs}
        <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="16" font-weight="700" style="fill:var(--text)">${fmtHoursMinutes(totalMs)}</text>
        <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="10" style="fill:var(--muted)">total</text>
      </svg>`;

    legend.innerHTML = cats.map(cat => {
      const ms = totals[cat.id] || 0;
      const pct = ((ms/totalMs)*100).toFixed(1);
      return `<span class="legend-item"><span class="legend-swatch" style="background:${cat.color || DEFAULT_COLOR}"></span>${escapeHtml(cat.name)} &middot; ${pct}%</span>`;
    }).join("");
  }

  function renderTrendChart(){
    const now = new Date();
    const thisWeekStart = getWeekStart(now);
    const weeks = [];
    for(let i=7;i>=0;i--){
      const ws = addDays(thisWeekStart, -7*i);
      const we = addDays(ws, 7);
      const totals = totalsForRange(ws.getTime(), we.getTime());
      const sum = Object.values(totals).reduce((a,b)=>a+b,0);
      weeks.push({start:ws, ms:sum});
    }
    const maxMs = Math.max(1, ...weeks.map(w=>w.ms));
    const width = 560, height = 160, chartH = 110, padL = 14, padR = 14;
    const stepX = (width - padL - padR) / (weeks.length - 1);
    const points = weeks.map((w,i) => ({
      x: padL + i*stepX,
      y: chartH - (w.ms/maxMs)*chartH,
      w
    }));
    const path = points.map((p,i) => (i===0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
    const dots = points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="var(--green)"><title>Week of ${fmtDateLabel(p.w.start)}: ${fmtHoursMinutes(p.w.ms)}</title></circle>`).join("");
    const labels = points.map((p,i) => i % 2 === 0 ? `<text x="${p.x.toFixed(1)}" y="${chartH+16}" font-size="10" text-anchor="middle" style="fill:var(--muted)">${fmtDateLabel(p.w.start)}</text>` : "").join("");

    document.getElementById("trendChartWrap").innerHTML = `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}">
        <line x1="${padL}" y1="${chartH}" x2="${width-padR}" y2="${chartH}" style="stroke:var(--border)" stroke-width="1"/>
        <path d="${path}" fill="none" stroke="var(--green)" stroke-width="2"/>
        ${dots}
        ${labels}
      </svg>`;
  }

  document.getElementById("applyRange").addEventListener("click", applyCustomRange);
  document.querySelectorAll("#quickRanges button").forEach(btn=>{
    btn.addEventListener("click", () => applyQuickRange(btn.dataset.range));
  });
  document.getElementById("tableToggle").addEventListener("click", () => {
    showTable = !showTable;
    document.getElementById("detailsTable").classList.toggle("show", showTable);
    document.getElementById("tableToggle").textContent = showTable ? "Hide details table" : "Show details table";
  });

  // ---------- tabs ----------
  const tabTracker = document.getElementById("tabTracker");
  const tabDashboard = document.getElementById("tabDashboard");
  const viewTracker = document.getElementById("viewTracker");
  const viewDashboard = document.getElementById("viewDashboard");

  tabTracker.addEventListener("click", () => {
    tabTracker.classList.add("active");
    tabDashboard.classList.remove("active");
    viewTracker.classList.add("active");
    viewDashboard.classList.remove("active");
  });
  tabDashboard.addEventListener("click", () => {
    tabDashboard.classList.add("active");
    tabTracker.classList.remove("active");
    viewDashboard.classList.add("active");
    viewTracker.classList.remove("active");
    if(!currentRange) applyQuickRange("week");
    else renderDashboard();
  });

  // ---------- settings: export / import ----------
  const settingsBtn = document.getElementById("settingsBtn");
  const settingsPanel = document.getElementById("settingsPanel");
  settingsBtn.addEventListener("click", () => settingsPanel.classList.toggle("show"));

  document.getElementById("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `timetracker-backup-${toDateInputValue(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  const importFile = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", () => importFile.click());
  importFile.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.categories) || !Array.isArray(parsed.sessions)){
          alert("That file doesn't look like a valid TimeTracker backup.");
          return;
        }
        parsed.categories.forEach(c => {
          if(!c.color) c.color = DEFAULT_COLOR;
          if(c.archived == null) c.archived = false;
        });
        if(!Array.isArray(parsed.adjustments)) parsed.adjustments = [];
        state = parsed;
        save();
        closeAllCardPanels();
        renderTracker();
        currentRange = null;
        if(viewDashboard.classList.contains("active")) applyQuickRange("week");
        alert("Backup imported.");
      }catch(err){
        alert("Could not read that file as JSON.");
      }
    };
    reader.readAsText(file);
    importFile.value = "";
  });

  // ---------- init ----------
  renderTracker();
})();
</script>
</body>
</html>
